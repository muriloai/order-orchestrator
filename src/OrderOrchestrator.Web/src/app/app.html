<!-- Floating Toasts Notification Container -->

<div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col selection:bg-emerald-500 selection:text-white">
  <!-- Top Navigation Bar -->
  <app-header></app-header>

  <!-- Main Dashboard Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
    
    <!-- Section 1: Visual Pub/Sub & RabbitMQ Flow -->
    <section>
      <app-pubsub-flow></app-pubsub-flow>
    </section>

      <app-inventory-cards></app-inventory-cards>
